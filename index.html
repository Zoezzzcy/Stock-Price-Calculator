<title>我的股票</title>
<style>
/* 高对比度：纯白卡片 + 纯黑字，涨跌用实心色块 + "涨/跌"文字，不只靠颜色区分 */
:root{--bg:#e9e6df;--card:#fff;--ink:#000;--soft:#2b2b2b;--line:#8a8a8a;--up:#c4001a;--down:#007a33;--btn:#0b3fb3}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:21px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:36px;margin:4px 0 2px}
.sub{color:var(--soft);font-size:19px;margin:0 0 16px}
.add{display:flex;gap:10px;flex-wrap:wrap}
.add input{flex:1 1 220px;font-size:23px;padding:14px 16px;border:3px solid #000;border-radius:14px;background:#fff;color:#000}
.add input::placeholder{color:#555}
.add input:focus{outline:4px solid #ffb300;outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:14px;border:0;min-height:56px;padding:0 22px;color:#000}
button:focus-visible{outline:4px solid #ffb300;outline-offset:2px}
.primary{background:var(--btn);color:#fff;font-weight:700}
.ghost{background:#fff;border:3px solid #000;font-weight:600}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.choices button{background:#fff;border:3px solid var(--btn);color:var(--btn);text-align:left;font-size:22px;font-weight:600}
.msg{min-height:30px;margin:10px 0;font-size:20px;color:var(--soft)}
.msg.err{color:var(--up);font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.time{color:var(--soft);font-size:18px}
.card{background:var(--card);border:2px solid #000;border-radius:20px;padding:18px;margin-bottom:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.name{font-size:30px;font-weight:800;line-height:1.2}
.code{color:var(--soft);font-size:18px}
.live{display:inline-block;font-size:16px;font-weight:700;padding:0 8px;border-radius:6px;background:#000;color:#fff;margin-left:6px;vertical-align:2px}
.price{text-align:right;margin-left:auto}
.big{font-size:46px;font-weight:800;line-height:1.05;white-space:nowrap}
.badge{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:10px;font-size:26px;font-weight:800;color:#fff;white-space:nowrap}
.bg-up{background:var(--up)}.bg-down{background:var(--down)}.bg-flat{background:#555}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:#333}

/* 今天的价格尺：最低 —— 最高，开盘(空心圈) → 现价/收盘(实心圈) */
.ruler{margin:20px 4px 6px}
.track{position:relative;height:16px;background:#d4d0c8;border-radius:8px}
.seg{position:absolute;top:0;bottom:0;border-radius:8px}
.mk{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid #000;background:#fff}
.mk.c{border-color:#fff;box-shadow:0 0 0 3px #000}
.ends{display:flex;justify-content:space-between;margin-top:12px;font-size:18px;color:var(--soft)}
.ends b{display:block;font-size:22px;color:#000}
.ends span:last-child{text-align:right}
.say{font-size:23px;margin:12px 0 4px;line-height:1.6}
.say .o{display:inline-block;width:20px;height:20px;border-radius:50%;border:4px solid #000;vertical-align:-2px}
.say .x{display:inline-block;width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 3px #000;border:3px solid #fff;vertical-align:-2px}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{flex:1 1 140px;border:2px solid #000;border-radius:14px;padding:8px 12px}
.chip .k{font-size:18px;font-weight:600}
.chip .v{font-size:30px;font-weight:800;white-space:nowrap;line-height:1.2}
.chip .h{font-size:15px;color:var(--soft)}

.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.acts button{min-height:52px;font-size:20px}
.del{background:#fff;border:3px solid var(--up);color:var(--up);font-weight:700}
.sure{background:var(--up);color:#fff;font-weight:700}

/* 20天走势：每根柱子 = 一天。粗柱是开盘到收盘，细线是最高到最低 */
.trend{margin-top:16px;border-top:2px solid #000;padding-top:14px}
.day{font-size:21px;background:#f2f0ea;border-radius:12px;padding:10px 14px;line-height:1.7}
.day b{font-size:23px}
.cols{display:flex;gap:2px;height:230px;margin-top:12px}
.col{flex:1;display:flex;flex-direction:column;align-items:stretch;padding:6px 0 0;min-height:0;border-radius:10px;background:transparent;border:2px solid transparent}
.col.on{background:#fff6d1;border-color:#000}
.plot{position:relative;flex:1}
.wick{position:absolute;left:50%;width:3px;margin-left:-1.5px;background:#000}
.body{position:absolute;left:15%;right:15%;min-height:4px;border-radius:3px}
.d{font-size:16px;font-weight:700;padding:4px 0 2px;text-align:center;white-space:nowrap;overflow:visible}
.legend{font-size:16px;color:var(--soft);margin-top:8px}
.empty{text-align:center;color:var(--soft);padding:30px 10px}
.help{margin-top:24px;background:#fff;border:2px solid #000;border-radius:16px;padding:14px 18px;font-size:19px}
@media(max-width:480px){
  body{font-size:19px}
  .wrap{padding:12px 10px 40px}
  h1{font-size:28px}
  .card{padding:14px 12px;border-radius:16px}
  .top{flex-wrap:nowrap}
  .name{font-size:24px}
  .code{font-size:15px}
  .big{font-size:34px}
  .badge{font-size:20px;padding:2px 10px}
  .say{font-size:20px;white-space:nowrap}
  .chips{flex-wrap:nowrap;gap:6px}
  .chip{flex:1 1 0;padding:6px 8px;border-radius:10px}
  .chip .k{font-size:15px}
  .chip .v{font-size:21px}
  .chip .h{font-size:13px}
  .day{font-size:18px;padding:8px 10px}.day b{font-size:19px}
  .cols{gap:1px;height:200px}
  .d{font-size:13px}
  .acts button{flex:1}
}
</style>
</head>
<body>
<div class="wrap">

  <form class="add" id="addForm">
    <input id="q" placeholder="股票名称或代码" autocomplete="off">
    <button class="primary" type="submit">添加</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="choices" id="choices"></div>

  <div class="bar">
    <span class="time" id="time">正在获取数据…</span>
    <button class="ghost" id="refresh">刷新</button>
  </div>
  <div id="list"></div></div>

<script>
{
const $ = id => document.getElementById(id);
const KEY = 'mom-stocks';
let stocks = load();
const data = {};
const openTrend = new Set();
const selDay = {};
let confirmDel = null;

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(s)) return s; }catch(e){}
  return [{code:'sh600519', name:'贵州茅台'}];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(stocks)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 用 <script> 方式读取腾讯行情（不需要安装任何东西）
function jsonp(url, varName){
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    const t = setTimeout(() => { s.remove(); fail(new Error('timeout')); }, 10000);
    s.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
    s.charset = 'utf-8';
    s.onload = () => { clearTimeout(t); const v = window[varName]; try{ delete window[varName]; }catch(e){} s.remove(); v === undefined ? fail(new Error('empty')) : ok(v); };
    s.onerror = () => { clearTimeout(t); s.remove(); fail(new Error('network')); };
    document.body.appendChild(s);
  });
}

async function fetchStock(code){
  const v = 'k_' + code;
  const r = await jsonp(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?_var=${v}&param=${code},day,,,21,`, v);
  const d = r && r.data && r.data[code];
  if(!d || !d.day || !d.day.length) throw new Error('nodata');
  const name = ((d.qt && d.qt[code] && d.qt[code][1]) || code).replace(/\s+/g, '');
  let prev = parseFloat(d.prec);
  const rows = d.day.map(a => {
    const row = {date:a[0], open:+a[1], close:+a[2], high:+a[3], low:+a[4], prev: isNaN(prev) ? null : prev};
    prev = row.close;
    return row;
  }).filter(x => x.prev);
  rows.forEach(x => {
    x.diff = x.close - x.open;
    x.pct = (x.close - x.prev) / x.prev * 100;
    x.amp = (x.high - x.low) / x.prev * 100;
  });
  return {name, rows: rows.slice(-20)};
}

async function search(q){
  q = q.trim();
  if(/^\d{6}$/.test(q)){
    const ex = /^[69]/.test(q) ? 'sh' : /^[48]/.test(q) ? 'bj' : 'sz';
    return [{code: ex + q, name: q}];
  }
  const h = await jsonp('https://smartbox.gtimg.cn/s3/?v=2&t=gp&q=' + encodeURIComponent(q), 'v_hint');
  if(!h || h === 'N') return [];
  return h.split('^').map(x => x.split('~'))
    .filter(p => ['sh','sz','bj'].includes(p[0]) && /^\d{6}$/.test(p[1]) && /^GP/.test(p[4] || ''))
    .slice(0, 6).map(p => ({code: p[0] + p[1], name: p[2]}));
}

const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
const word = n => n > 0 ? '涨' : n < 0 ? '跌' : '平';
const sign = n => n > 0 ? '+' : '';
const f2 = n => n.toFixed(2);
const col = n => n > 0 ? 'var(--up)' : n < 0 ? 'var(--down)' : '#555';

function isLive(date){
  const n = new Date();
  const today = n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
  return date === today && n.getHours()*60 + n.getMinutes() < 15*60 + 1;
}

function ruler(t, live){
  const lo = t.low, sp = (t.high - t.low) || 1;
  const p = v => Math.max(0, Math.min(100, (v - lo) / sp * 100));
  const po = p(t.open), pc = p(t.close);
  return `<div class="ruler"><div class="track">
      <div class="seg" style="left:${Math.min(po,pc)}%;width:${Math.abs(pc-po)}%;background:${col(t.diff)}"></div>
      <div class="mk" style="left:${po}%"></div>
      <div class="mk c" style="left:${pc}%;background:${col(t.diff)}"></div>
    </div>
    <div class="ends"><span>最低<b>${f2(t.low)}</b></span><span>最高<b>${f2(t.high)}</b></span></div></div>
    <p class="say"><span class="o"></span>开盘 <b>${f2(t.open)}</b> → <span class="x" style="background:${col(t.diff)}"></span>${live ? '现价' : '收盘'} <b class="${cls(t.diff)}">${f2(t.close)}</b></p>`;
}

function trend(code, rows){
  const i = selDay[code] ?? rows.length - 1;
  const r = rows[i];
  const hi = Math.max(...rows.map(x => x.high)), lo = Math.min(...rows.map(x => x.low)), sp = (hi - lo) || 1;
  const y = v => (hi - v) / sp * 100;
  const c = esc(code);
  return `<div class="trend">
    <div class="day"><b>${esc(r.date.slice(5).replace('-', '月'))}日</b>
      开盘 <b>${f2(r.open)}</b>　收盘 <b>${f2(r.close)}</b><br>
      差价 <b class="${cls(r.diff)}">${sign(r.diff)}${f2(r.diff)}</b>
      涨跌幅 <b class="${cls(r.pct)}">${word(r.pct)} ${sign(r.pct)}${f2(r.pct)}%</b>
      振幅 <b>${f2(r.amp)}%</b></div>
    <div class="cols">${rows.map((x, k) => `<button class="col${k === i ? ' on' : ''}" data-act="day" data-code="${c}" data-i="${k}" aria-label="${esc(x.date)}">
        <span class="plot">
          <span class="wick" style="top:${y(x.high)}%;height:${(x.high - x.low) / sp * 100}%"></span>
          <span class="body" style="top:${y(Math.max(x.open, x.close))}%;height:${Math.abs(x.close - x.open) / sp * 100}%;background:${col(x.diff)}"></span>
        </span><span class="d">${(k === i || ((rows.length - 1 - k) % 5 === 0 && Math.abs(k - i) > 2)) ? +x.date.slice(8) + '日' : '&nbsp;'}</span></button>`).join('')}</div>  </div>`;
}

function render(){
  if(!stocks.length){ $('list').innerHTML = '<div class="card empty">还没有股票。在上面输入名称，点“添加”。</div>'; return; }
  $('list').innerHTML = stocks.map(s => {
    const d = data[s.code];
    const name = esc(d ? d.name : s.name), code = esc(s.code.slice(2));
    if(!d) return `<div class="card"><div class="name">${name}</div><div class="code">${code}</div><p class="msg">${s.err ? '暂时取不到数据，稍后点“刷新”再试' : '正在获取…'}</p>${acts(s.code, false)}</div>`;
    const t = d.rows[d.rows.length - 1];
    const live = isLive(t.date);
    return `<div class="card">
      <div class="top">
        <div><div class="name">${name}</div><div class="code">${code} · ${esc(t.date.slice(5).replace('-', '月'))}日${live ? '<span class="live">交易中</span>' : ''}</div></div>
        <div class="price"><div class="big ${cls(t.pct)}">${f2(t.close)}</div>
          <span class="badge bg-${cls(t.pct)}">${word(t.pct)} ${sign(t.pct)}${f2(t.pct)}%</span></div>
      </div>
      ${ruler(t, live)}
      <div class="chips">
        <div class="chip"><div class="k">差价</div><div class="v ${cls(t.diff)}">${sign(t.diff)}${f2(t.diff)}</div></div>
        <div class="chip"><div class="k">涨跌幅</div><div class="v ${cls(t.pct)}">${sign(t.pct)}${f2(t.pct)}%</div><div class="h">昨收 ${f2(t.prev)}</div></div>
        <div class="chip"><div class="k">振幅</div><div class="v">${f2(t.amp)}%</div></div>
      </div>
      ${acts(s.code, true)}
      ${openTrend.has(s.code) ? trend(s.code, d.rows) : ''}
    </div>`;
  }).join('');
}

function acts(code, hasData){
  const c = esc(code);
  const h = hasData ? `<button class="ghost" data-act="trend" data-code="${c}">${openTrend.has(code) ? '收起走势' : '看最近20天走势'}</button>` : '';
  const d = confirmDel === code
    ? `<button class="sure" data-act="sure" data-code="${c}">确定删除</button><button class="ghost" data-act="cancel">不删了</button>`
    : `<button class="del" data-act="del" data-code="${c}">删除</button>`;
  return `<div class="acts">${h}${d}</div>`;
}

async function refresh(){
  $('time').textContent = '正在更新…';
  await Promise.all(stocks.map(async s => {
    try{ data[s.code] = await fetchStock(s.code); s.err = false;
         if(s.name !== data[s.code].name){ s.name = data[s.code].name; save(); } }
    catch(e){ s.err = true; }
  }));
  const n = new Date();
  $('time').textContent = '更新于 ' + n.getHours() + ':' + String(n.getMinutes()).padStart(2,'0');
  render();
}

async function addStock(s){
  $('choices').innerHTML = '';
  if(stocks.some(x => x.code === s.code)){ msg(s.name + ' 已经在列表里了'); return; }
  msg('正在添加…');
  try{
    const d = await fetchStock(s.code);
    data[s.code] = d;
    stocks.unshift({code: s.code, name: d.name});
    save(); $('q').value = ''; msg('已添加 ' + d.name); render();
  }catch(e){ msg('没找到这只股票，请检查名称或代码', true); }
}

function msg(t, err){ $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }

$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value;
  if(!q.trim()){ msg('请先输入股票名称或代码', true); return; }
  msg('正在查找…'); $('choices').innerHTML = '';
  let res;
  try{ res = await search(q); }catch(err){ msg('网络好像有问题，请稍后再试', true); return; }
  if(!res.length){ msg('没找到“' + q.trim() + '”，换个说法试试', true); return; }
  if(res.length === 1){ addStock(res[0]); return; }
  msg('找到好几只，点一下要添加的那只：');
  $('choices').innerHTML = res.map((r, i) => `<button type="button" data-i="${i}">${esc(r.name)}　${esc(r.code.slice(2))}</button>`).join('');
  $('choices').onclick = ev => { const b = ev.target.closest('button'); if(b) addStock(res[+b.dataset.i]); };
});

$('list').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const code = b.dataset.code, act = b.dataset.act;
  if(act === 'trend'){ openTrend.has(code) ? openTrend.delete(code) : openTrend.add(code); }
  if(act === 'day') selDay[code] = +b.dataset.i;
  if(act === 'del') confirmDel = code;
  if(act === 'cancel') confirmDel = null;
  if(act === 'sure'){ stocks = stocks.filter(s => s.code !== code); delete data[code]; confirmDel = null; save(); }
  render();
});
$('refresh').addEventListener('click', refresh);

render();
refresh();
setInterval(() => { const h = new Date().getHours(); if(h >= 9 && h < 16) refresh(); }, 60000);
}
</script>
</body>
</html>
